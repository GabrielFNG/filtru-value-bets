<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>🎯 Filtru Value Bets</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#101418;color:#eee}
.wrap{max-width:1200px;margin:0 auto;padding:22px}
.card{background:#181e24;border:1px solid #2c343d;border-radius:16px;padding:22px;box-shadow:0 10px 35px #0005}
h1{margin:0 0 8px;font-size:28px}
.muted{color:#9da7b1;font-size:14px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0}
.tab{border:0;border-radius:10px;padding:12px 18px;background:#252c33;color:#eee;font-weight:bold;cursor:pointer}
.tab.active{background:#20c8e8;color:#061217}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px}
label{display:block;color:#aeb7c0;font-size:13px;margin-bottom:6px}
input,select{width:100%;padding:12px;border-radius:9px;border:1px solid #3b444e;background:#20272e;color:#fff;font-size:15px}
button.search{width:100%;margin-top:18px;padding:14px;border:0;border-radius:10px;background:#20c8e8;color:#061217;font-size:16px;font-weight:bold;cursor:pointer}
.summary{margin-top:16px;color:#b9c2ca}
.table-wrap{overflow:auto;margin-top:14px}
table{width:100%;border-collapse:collapse;min-width:750px}
th,td{text-align:left;padding:12px;border-bottom:1px solid #2c343d}
th{color:#8f9aa5;font-size:12px;text-transform:uppercase}
.edge{font-weight:bold}
.good{color:#58e58b}
.bad{color:#ff7272}
.empty{padding:28px;text-align:center;color:#9da7b1}
@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}}
@media(max-width:520px){.wrap{padding:10px}.card{padding:15px}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
<div class="card">
<h1>🎯 Filtru Value Bets</h1>
<div class="muted">🔎 Modul analiză: afișează toate edge-urile calculabile, pozitive și negative.</div>
<div style="margin-top:16px">
<label>Cheia API Bzzoiro</label>
<input id="api_key" type="password" autocomplete="off" placeholder="Token API">
<label style="display:flex;align-items:center;gap:8px;margin-top:8px;color:#9da7b1">
<input id="save_key" type="checkbox" style="width:auto"> salvează cheia pe dispozitiv
</label>
</div>

<div class="tabs">
<button class="tab active" data-market="1x2">1X2</button>
<button class="tab" data-market="gg">GG</button>
<button class="tab" data-market="goals">Peste/Sub goluri</button>
<button class="tab" data-market="all">Toate piețele</button>
</div>

<div class="grid">
<div>
<label>Zile înainte</label>
<input id="days" type="number" min="0" value="1">
</div>

<div>
<label>Ligă / competiție</label>
<select id="league"><option value="all">Toate ligile</option></select>
</div>

<div>
<label>Probabilitate minimă (%) — ignorată în analiza completă</label>
<input id="min_prob" type="number" min="0" max="100" step="0.1" value="0">
</div>

<div>
<label>Edge minim (pp) — ignorat în analiza completă</label>
<input id="min_edge" type="number" step="0.1" value="0">
</div>

<div>
<label>Cotă minimă — ignorată în analiza completă</label>
<input id="odds_min" type="number" min="1" step="0.01" value="1">
</div>

<div>
<label>Cotă maximă — ignorată în analiza completă</label>
<input id="odds_max" type="number" min="1" step="0.01" value="100">
</div>

<div>
<label>Max. selecții — ignorat în analiza completă</label>
<input id="max_picks" type="number" min="1" value="30">
</div>

<div id="selection_box">
<label>Selecție</label>
<select id="selection">
<option value="all">Toate</option>
</select>
</div>

<div id="line_box" style="display:none">
<label>Linie goluri</label>
<select id="line">
<option value="0.5">0.5</option>
<option value="1.5">1.5</option>
<option value="2.5" selected>2.5</option>
<option value="3.5">3.5</option>
<option value="4.5">4.5</option>
</select>
</div>
</div>

<button class="search" id="search">🔎 Caută value bets</button>

<div class="summary" id="summary">Aștept căutarea...</div>

<div class="table-wrap">
<table>
<thead>
<tr>
<th>Meci</th><th>Ligă</th><th>Piață / selecție</th><th>Prob.</th><th>Cotă</th><th>Edge</th>
</tr>
</thead>
<tbody id="rows"></tbody>
</table>
</div>
</div>
</div>

<script>
let market="1x2";

const tabs=[...document.querySelectorAll(".tab")];
const selection=document.getElementById("selection");
const lineBox=document.getElementById("line_box");
const selectionBox=document.getElementById("selection_box");

function updateControls(){
  selection.innerHTML="";
  if(market==="1x2"){
    [["all","Toate"],["home","1 — Gazde"],["draw","X — Egal"],["away","2 — Oaspeți"]]
      .forEach(x=>selection.add(new Option(x[1],x[0])));
  }else if(market==="gg"){
    [["all","Toate"],["yes","GG Da"],["no","GG Nu"]]
      .forEach(x=>selection.add(new Option(x[1],x[0])));
  }else if(market==="goals"){
    [["all","Toate"],["over","Peste"],["under","Sub"]]
      .forEach(x=>selection.add(new Option(x[1],x[0])));
  }else{
    selection.add(new Option("Toate","all"));
  }
  selectionBox.style.display=market==="all"?"none":"block";
  lineBox.style.display=market==="goals"||market==="all"?"block":"none";
}

tabs.forEach(t=>t.onclick=()=>{
  tabs.forEach(x=>x.classList.remove("active"));
  t.classList.add("active");
  market=t.dataset.market;
  updateControls();
});

function dateStr(d){
  return d.toISOString().slice(0,10);
}

async function search(){
  const days=Math.max(0,Number(document.getElementById("days").value||1));
  const now=new Date();
  const from=dateStr(now);
  const toDate=new Date(now);
  toDate.setDate(toDate.getDate()+days);
  const to=dateStr(toDate);

  const payload={
    date_from:from,
    date_to:to,
    market,
    selection:selection.value,
    line:document.getElementById("line").value,
    league:document.getElementById("league").value,
    min_prob:Number(document.getElementById("min_prob").value||0),
    min_edge:Number(document.getElementById("min_edge").value||0),
    odds_min:Number(document.getElementById("odds_min").value||1),
    odds_max:Number(document.getElementById("odds_max").value||100),
    max_picks:Number(document.getElementById("max_picks").value||30)
  };

  const summary=document.getElementById("summary");
  const rows=document.getElementById("rows");
  summary.textContent="Se caută...";
  rows.innerHTML="";

  try{
    let key=document.getElementById("api_key").value.trim();
    if(!key) key=localStorage.getItem("bzzoiro_api_key")||"";
    if(!key){
      summary.innerHTML='<span class="bad">Lipsește API Key.</span>';
      return;
    }
    if(document.getElementById("save_key").checked){
      localStorage.setItem("bzzoiro_api_key",key);
    }

    const r=await fetch("/api/search",{
      method:"POST",
      headers:{
        "Content-Type":"application/json",
        "Authorization":"Token "+key
      },
      body:JSON.stringify(payload)
    });

    const data=await r.json();
    if(!r.ok){
      summary.innerHTML='<span class="bad">'+(data.error||"Eroare API")+'</span>';
      return;
    }

    const leagues=data.leagues||[];
    const current=document.getElementById("league").value;
    document.getElementById("league").innerHTML='<option value="all">Toate ligile</option>';
    leagues.forEach(l=>document.getElementById("league").add(new Option(l,l)));
    if(leagues.includes(current)) document.getElementById("league").value=current;

    summary.textContent=
      `${(data.candidates||[]).length} edge-uri calculabile · `+
      `${data.events||0} meciuri · ${data.predictions||0} predicții · ${leagues.length} ligi · `+
      `${data.matched||0} potriviri · ${data.with_probabilities||0} cu probabilități · ${data.with_odds||0} cu cote`;

    (data.candidates||[]).forEach(x=>{
      const tr=document.createElement("tr");
      tr.innerHTML=
        `<td>${esc(x.home)} — ${esc(x.away)}<br><span class="muted">${esc(x.kickoff)}</span></td>`+
        `<td>${esc(x.league)}</td>`+
        `<td>${esc(x.market)} · <b>${esc(x.pick)}</b></td>`+
        `<td>${Number(x.prob).toFixed(1)}%</td>`+
        `<td>${Number(x.odds).toFixed(2)}</td>`+
        `<td class="edge ${Number(x.edge)>=0?"good":"bad"}">${Number(x.edge)>=0?"+":""}${Number(x.edge).toFixed(1)} pp</td>`;
      rows.appendChild(tr);
    });

    if(!(data.candidates||[]).length){
      rows.innerHTML='<tr><td colspan="6" class="empty">Nicio selecție nu îndeplinește filtrele.</td></tr>';
    }
  }catch(e){
    summary.innerHTML='<span class="bad">Eroare de conexiune: '+esc(e.message)+'</span>';
  }
}

function esc(s){
  return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

document.getElementById("search").onclick=search;
updateControls();
</script>
</body>
</html>
